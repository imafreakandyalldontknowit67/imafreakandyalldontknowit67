name: Refresh profile

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    # Standard Linux runner + public repository: free compute.
    # No artifacts, caches, packages, larger runners, or paid APIs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh public data and SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 refresh_stats.py
      - name: Validate profile
        run: python3 validate_profile.py
      - name: Commit updated profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md stats-data.json activity-data.json assets/stats-*.svg assets/activity-*.svg
          if git diff --cached --quiet; then
            echo 'Profile is already up to date.'
          else
            git commit -m 'Refresh public profile stats and activity'
            git push
          fi
